name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # The matrix itself lives in tox.ini; this only pairs each environment
        # with the interpreter it needs.
        include:
          - { python: "3.13", toxenv: "py313-dj61-drf318" }
          - { python: "3.12", toxenv: "py312-dj61-drf318" }
          - { python: "3.12", toxenv: "py312-dj60-drf317,py312-dj60-drf318" }
          - { python: "3.12", toxenv: "py312-dj52-drf315,py312-dj52-drf316,py312-dj52-drf317,py312-dj52-drf318" }
          - { python: "3.12", toxenv: "py312-dj42-drf317" }
          - { python: "3.11", toxenv: "py311-dj50-drf316" }
          - { python: "3.10", toxenv: "py310-dj42-drf316,py310-dj52-drf318" }
          - { python: "3.9", toxenv: "py39-dj42-drf315,py39-dj42-drf316" }

    name: Python ${{ matrix.python }} (${{ matrix.toxenv }})

    steps:
      - uses: actions/checkout@v4

      # A current interpreter to *run* tox with. The version under test is
      # provided by tox-uv (see UV_PYTHON_PREFERENCE below), not by this step:
      # `setup-python` can only install what the runner image ships, and
      # today's `ubuntu-latest` (Ubuntu 26.04) has no Python 3.9, which
      # reached end of life in October 2025. The library still supports it,
      # so the matrix must not depend on the image.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-uv

      - name: Run tests
        env:
          # Makes uv download the exact interpreter each environment asks for.
          UV_PYTHON_PREFERENCE: only-managed
        run: python -m tox -e ${{ matrix.toxenv }}

  extras:
    runs-on: ubuntu-latest
    name: Checks, installed wheel and compat shim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip tox tox-uv
      # `checks` asserts CoreAPI stays out; `wheel` and `shim` exercise the
      # installed distributions rather than the source tree.
      - run: python -m tox -e checks,wheel,shim

  build:
    runs-on: ubuntu-latest
    name: Build distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Build the optional compatibility shim
        run: python -m build compat --outdir dist-compat
      - run: python -m twine check --strict dist-compat/*
