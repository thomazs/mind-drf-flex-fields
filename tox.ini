; Local and CI test matrix for mind-drf-flex-fields.
;
;   tox                        run the whole matrix
;   tox -e py312-dj61-drf318   run one combination
;   tox -e wheel               install the built wheel and smoke-test it
;   tox -e shim                install the library + compat shim together
;   tox -e checks              repo-level checks (no CoreAPI, etc.)
;   tox -l                     list every environment
;
; Install with `pip install tox`, or `pip install tox tox-uv` to have uv build
; the environments (much faster for a matrix this size). Add `-p auto` to run
; them in parallel.
;
; If a Python on your machine is an incomplete build - a pyenv install without
; `_sqlite3`, for example - its environments fail before the first test. With
; tox-uv you can sidestep that by having uv fetch its own interpreters:
;
;   UV_PYTHON_PREFERENCE=only-managed tox
;
; The combinations below are the installable ones. The upstream constraints
; that rule the rest out:
;
;   Django 4.2       Python >= 3.8
;   Django 5.0-5.2   Python >= 3.10
;   Django 6.0-6.1   Python >= 3.12
;   DRF 3.15         Python >= 3.8,  Django >= 4.2
;   DRF 3.16         Python >= 3.9,  Django >= 4.2
;   DRF 3.17         Python >= 3.10, Django >= 4.2
;   DRF 3.18         Python >= 3.10, Django >= 5.2

[tox]
envlist =
    py39-dj42-drf{315,316}
    py310-dj42-drf316
    py310-dj52-drf318
    py311-dj50-drf316
    py312-dj42-drf317
    py312-dj52-drf{315,316,317,318}
    py312-dj60-drf{317,318}
    py312-dj61-drf318
    py313-dj61-drf318
    checks
    wheel
    shim
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run the test suite against one Django/DRF combination
deps =
    dj42: Django>=4.2,<4.3
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    drf315: djangorestframework>=3.15,<3.16
    drf316: djangorestframework>=3.16,<3.17
    drf317: djangorestframework>=3.17,<3.18
    drf318: djangorestframework>=3.18,<3.19
    pytest>=8.0
    pytest-django>=4.9
    ; Needed by DRF's OpenAPI schema generator (tests/test_schema.py).
    uritemplate>=4.1.1
    inflection>=0.5.1
    PyYAML>=6.0
commands =
    python -c "import django, rest_framework; print('Django', django.get_version(), '/ DRF', rest_framework.VERSION)"
    pytest {posargs}
; Note: these environments run from the project root, so `mind_flex_fields` is
; imported from the source tree rather than from the installed distribution -
; the current directory wins on sys.path. That matches what CI did before tox,
; and is what you want while developing. The `wheel` and `shim` environments
; below are the ones that exercise the installed artifacts.

[testenv:checks]
description = Repo-level checks that do not depend on the Django/DRF version
skip_install = true
deps =
commands =
    ; The point of the fork: CoreAPI must never come back.
    python {toxinidir}/tests/check_no_coreapi.py

[testenv:wheel]
description = Install the built distribution and smoke-test it outside the source tree
; Running from a temp directory keeps the source tree off sys.path, so the
; import really resolves to the installed package.
changedir = {envtmpdir}
deps =
    Django
    djangorestframework
commands =
    python {toxinidir}/tests/smoke_installed.py

[testenv:shim]
description = Install the library and the compat shim, then use the legacy import path
changedir = {envtmpdir}
deps =
    Django
    djangorestframework
    ; pip is declared explicitly because tox-uv builds environments without
    ; it; setuptools/wheel let the shim build without build isolation.
    pip
    setuptools>=77.0.3
    wheel
; The shim is installed after the project itself, and with --no-deps: it
; depends on `mind-drf-flex-fields` by name, and that release is not on PyPI
; yet, so a normal resolve would try to download it and fail. Listing it in
; `deps` would not work either - deps are installed before the project.
commands_pre =
    python -m pip install --no-deps --no-build-isolation {toxinidir}/compat
commands =
    python {toxinidir}/tests/smoke_shim.py

[testenv:build]
description = Build and validate both distributions
skip_install = true
deps =
    build
    twine
commands =
    python -m build --outdir {toxinidir}/dist
    python -m twine check --strict {toxinidir}/dist/*
    python -m build {toxinidir}/compat --outdir {toxinidir}/dist-compat
    python -m twine check --strict {toxinidir}/dist-compat/*
